name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/hooks/hooks.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" && echo "ok $f"
          done
      - name: Every marketplace entry points at a plugin folder
        run: |
          node -e '
            const fs = require("fs")
            const { plugins } = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"))
            for (const p of plugins) {
              const manifest = JSON.parse(fs.readFileSync(`${p.source}/.claude-plugin/plugin.json`, "utf8"))
              if (manifest.name !== p.name) throw new Error(`${p.source}: name ${manifest.name} != ${p.name}`)
              console.log("ok", p.name)
            }'
      - name: Claude Code validate and test
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          for dir in plugins/*/; do claude plugin test "$dir"; done
