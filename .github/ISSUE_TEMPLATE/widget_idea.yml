name: Widget idea
description: Suggest a new widget
labels: [widget-idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What should it show?
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Which Claude Code events would feed it?
      description: An event name, if you know one. Never paste real prompts or outputs.
